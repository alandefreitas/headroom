# Publishing a GitHub release builds the universal app and attaches the
# .dmg, .zip and checksums to it. Write the notes, publish, and CI does the rest.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./release.sh "${GITHUB_REF_NAME#v}"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
